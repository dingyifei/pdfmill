version: 1
settings:
  on_error: continue
  cleanup_source: true
  cleanup_output_after_print: true
input:
  path: input
  pattern: Print*.pdf
outputs:
  packing_sheet:
    pages: 1--1
    output_dir: output
    filename_suffix: _1
    print:
      enabled: true
      merge: true
      targets:
        BrotherLaser:
          printer: Brother_HL_L2420DW
          weight: 1
          copies: 1
          options:
            sides: one-sided
  label:
    pages: last
    output_dir: output
    filename_suffix: _2
    transforms:
    - rotate: 90
    - crop:
        lower_left:
        - 86.6mm
        - 30.5mm
        upper_right:
        - 186.6mm
        - 180.5mm
    - size:
        width: 100mm
        height: 150mm
        fit: stretch
    print:
      enabled: true
      merge: true
      targets:
        default:
          printer: PL80E-BT
          weight: 1
          copies: 1
          options:
            media: w284h426   # 4x6in / 100x150mm label (see: lpoptions -p PL80E-BT -l)
      max_page_size: [4.1in, 6.1in]
