version: 1
settings:
  on_error: continue
  cleanup_source: true
  cleanup_output_after_print: true
input:
  path: input
  pattern: Print*.pdf
  fields:  # read from the packing list, used in the label stamp below
    order: 'Order No\.\s*(\d+)'
    box:   # "Box 2. Your order will ship in 4 boxes" -> " · BOX 2/4"; absent on single-box orders
      pattern: 'Box\s+(\d+)\.\s+Your order will ship in\s+(\d+)\s+boxes'
      format: ' · BOX \1/\2'
      default: ''
outputs:
  packing_sheet:
    pages: 1--1
    output_dir: output
    filename_suffix: _1
    print:
      enabled: true
      merge: true
      targets:
        BrotherLaser:
          printer: Brother_HL_L2420DW
          weight: 1
          copies: 1
          options:
            sides: one-sided
  label:
    pages: last
    output_dir: output
    filename_suffix: _2
    transforms:
    - rotate: 90
    - crop:
        lower_left:
        - 86.6mm
        - 30.5mm
        upper_right:
        - 186.6mm
        - 180.5mm
    - size:
        width: 100mm
        height: 150mm
        fit: stretch
    # Order/box in the label's "Additional Information and User" segment (bottom cell).
    # USPS Parcel Labeling Guide 2.5.1: right-justified, capitals, smaller than the
    # delivery address (~9.5pt here); IMmb 6.3.4: keep >= 0.1in clear of the 2D code,
    # which starts at x=86.7mm and is centred at y=8.6mm.
    - stamp:
        text: '#{order}{box}'
        position: custom
        align: right
        x: 83.5mm
        y: 7.9mm   # baseline; centres 6pt caps on the 2D code
        font_name: Helvetica-Bold
        font_size: 6
    print:
      enabled: true
      merge: true
      targets:
        default:
          printer: PL80E-BT
          weight: 1
          copies: 1
          options:
            media: w284h426   # 4x6in / 100x150mm label (see: lpoptions -p PL80E-BT -l)
      max_page_size: [4.1in, 6.1in]
