version: 1
settings:
  on_error: continue
  cleanup_source: true
  cleanup_output_after_print: true
input:
  path: input
  pattern: Lecture*.pdf
  sort: name_asc
outputs:
  default:
    pages: all
    output_dir: output
    debug: true
    transforms:
    - split:
        regions:
        - lower_left:
          - 45mm
          - 150mm
          upper_right:
          - 170mm
          - 240mm
        - lower_left:
          - 45mm
          - 37mm
          upper_right:
          - 170mm
          - 127mm
    - stamp:
        text: '{page}/{total}'
        position: bottom-right
        font_size: 10
        margin: 2mm
        font_color: black
        opacity: 1.0
    - combine:
        page_size:
        - 8.5in
        - 11in
        pages_per_output: 2
        layout:
        - page: 0
          position:
          - 0.5in
          - 5.5in
          scale: 1.5
        - page: 1
          position:
          - 0.5in
          - 0.2in
          scale: 1.5
    print:
      enabled: true
      merge: true
      targets:
        default:
          printer: Brother_HL_L2420DW
          weight: 1
          copies: 1
